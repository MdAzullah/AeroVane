name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/live-viewer/package-lock.json
      - run: npm ci
      - run: npm --prefix apps/live-viewer ci
      - run: npm run verify

  e2e:
    needs: verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/live-viewer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/live-viewer/package-lock.json
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/live-viewer/playwright-report/
          retention-days: 7
